name: Deploy public site
# Exporta los agregados públicos de NNDSS y publica site/ en GitHub Pages. Sin secretos de Cloudflare.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/export_public.py', '.github/workflows/pages.yml']
  workflow_call:
    secrets:
      NEON_DATABASE_URL:
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install psycopg2-binary==2.9.*
      - run: python -m scripts.export_public
      - run: node --test "site/js/*.test.mjs"   # falla si las cifras del sitio no coinciden con las anclas SQL
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
